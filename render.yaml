services:
  - type: web
    name: btec-jo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: RATE_LIMIT
        value: "30"
      - key: PUBLIC_URL
        sync: false

<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTEC JO | لوحة الطالب</title><meta name="description" content="لوحة طالب BTEC JO لمتابعة التخصص والصف والتقدم والمفضلة."><link rel="canonical" href="https://btec-jo.onrender.com/student-dashboard.html"><link rel="icon" type="image/svg+xml" href="../assets/btec-jo-logo.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="navigation.css"><link rel="stylesheet" href="style.css"><style>main{max-width:1100px;margin:0 auto;padding:50px 22px}.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.dash-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:22px;box-shadow:0 15px 40px rgba(0,0,0,.12)}.dash-card h2{margin-top:0}.dash-card input,.dash-card select{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.15);color:inherit;margin:7px 0 12px}.dash-btn{border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:#00a8e8;color:#fff;font-weight:800;margin:4px}.stat{font-size:28px;font-weight:900}.progressbar{height:12px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}.progressbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00a8e8,#315eea)}.muted{opacity:.75;font-size:.9rem}.fav-list{display:grid;gap:8px}.fav{padding:10px;border-radius:12px;background:rgba(255,255,255,.04)}body:not(.dark){background:#f6f8fc;color:#172033}.install{display:none}</style></head><body><script src="navigation.js"></script><main><section class="hero" style="margin-bottom:24px"><div class="hero-content"><h1>📊 لوحة الطالب</h1><p>احفظ تخصصك وصفك، تابع تقدمك، واحفظ الأشياء التي تريد الرجوع لها.</p><button class="dash-btn install" id="installBtn">📲 تثبيت BTEC JO كتطبيق</button></div></section><div class="dash-grid"><section class="dash-card"><h2>👤 ملفك الدراسي</h2><label>الصف</label><select id="grade"><option value="">اختر الصف</option><option>الصف العاشر</option><option>الأول الثانوي</option><option>الثاني الثانوي / التوجيهي</option></select><label>التخصص</label><input id="specialty" placeholder="مثال: إدارة الأعمال"><button class="dash-btn" id="saveProfile">حفظ</button><p class="muted" id="saved"></p></section><section class="dash-card"><h2>📈 تقدمك</h2><div class="stat"><span id="points">0</span> نقطة</div><p>أسئلة/أنشطة منجزة</p><div class="progressbar"><i id="bar"></i></div><p class="muted" id="progressText">0%</p><button class="dash-btn" id="addProgress">+ سجل إنجاز</button></section><section class="dash-card"><h2>⭐ المفضلة</h2><div class="fav-list" id="favorites"><p class="muted">لا توجد عناصر محفوظة بعد.</p></div><button class="dash-btn" id="clearFav">مسح المفضلة</button></section><section class="dash-card"><h2>🚀 اختصارات</h2><a class="dash-btn" href="ai.html">اسأل BTEC AI</a><a class="dash-btn" href="specialties-encyclopedia.html">التخصصات والوحدات</a><a class="dash-btn" href="quick-quiz.html">اختبار سريع</a><a class="dash-btn" href="daily-motivation.html">تحدي اليوم</a></section></div></main><script>const get=(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d));let profile=get("btecjo-profile",{grade:"",specialty:""}),points=Number(localStorage.getItem("btecjo-progress")||0),fav=get("btecjo-favorites",[]);grade.value=profile.grade;specialty.value=profile.specialty;function render(){pointsEl.textContent=points;const pct=Math.min(100,points);bar.style.width=pct+"%";progressText.textContent=pct+"%";favorites.innerHTML=fav.length?fav.map(x=>`<div class="fav">⭐ ${x}</div>`).join(""):"<p class=muted>لا توجد عناصر محفوظة بعد.</p>"}saveProfile.onclick=()=>{profile={grade:grade.value,specialty:specialty.value.trim()};localStorage.setItem("btecjo-profile",JSON.stringify(profile));saved.textContent="تم حفظ الملف الدراسي على هذا الجهاز."};addProgress.onclick=()=>{points=Math.min(100,points+5);localStorage.setItem("btecjo-progress",points);render()};clearFav.onclick=()=>{fav=[];localStorage.setItem("btecjo-favorites","[]");render()};render();let deferred;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;installBtn.style.display="inline-block"});installBtn.onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}};</script></body></html>
